<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurys Cigánykártya - Mátrix Labor</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-gold: #d4af37;
            --accent-gold-glow: rgba(212, 175, 55, 0.4);
            --text-color: #c5c6c7;
        }

        body {
            background: radial-gradient(circle, #1a1c23 0%, #050508 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px var(--accent-gold-glow);
        }

        .subtitle {
            color: var(--text-color);
            font-size: 0.85rem;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--accent-gold);
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .deck-container {
            display: none;
            width: 100%;
            max-width: 1100px;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .deck-container.active {
            display: flex;
        }

        #quickDraw {
            margin-top: 20px;
        }

        #quickDraw .card-wrapper {
            width: 180px;
            height: 300px;
        }

        #fullTableau {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            width: 100%;
        }

        #fullTableau .card-wrapper {
            width: 100%;
            height: 180px;
        }

        .card-wrapper {
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            border: 2px solid var(--accent-gold);
            box-sizing: border-box;
            overflow: hidden;
            background-color: #fff;
            display: flex;
            flex-direction: column;
        }

        .card-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-name-tag {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: var(--accent-gold);
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
            padding: 3px 0;
            border-top: 1px solid var(--accent-gold);
        }

        .action-btn {
            margin-top: 25px;
            background: transparent;
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 20px var(--accent-gold-glow);
        }
    </style>
</head>
<body>

    <h1>Aurys Cigánykártya</h1>
    <div class="subtitle">Mátrix Labor • Eredeti Klasszikus Pakli</div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('quick')">3 Lapos Gyorshúzás</button>
        <button class="tab-btn" onclick="switchTab('full')">36 Lapos Tabló</button>
    </div>

    <div id="quickDraw" class="deck-container active"></div>
    <div id="fullTableau" class="deck-container"></div>

    <button class="action-btn" onclick="reshuffleCurrentTab()">Újrakeverés / Új leosztás 𓋹</button>

    <script>
        // Wikipedia/Wikimedia stabil direkt képhivatkozások a klasszikus Cigánykártyákhoz
        const cardsData = [
            { name: "Szerelem", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Gypsy_card_Love.jpg/320px-Gypsy_card_Love.jpg" },
            { name: "Szerelmes férfi", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Gypsy_card_Lover_male.jpg/320px-Gypsy_card_Lover_male.jpg" },
            { name: "Szerelmes nő", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Gypsy_card_Lover_female.jpg/320px-Gypsy_card_Lover_female.jpg" },
            { name: "Házasság", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Gypsy_card_Marriage.jpg/320px-Gypsy_card_Marriage.jpg" },
            { name: "Hűség", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Gypsy_card_Fidelity.jpg/320px-Gypsy_card_Fidelity.jpg" },
            { name: "Remény", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Gypsy_card_Hope.jpg/320px-Gypsy_card_Hope.jpg" },
            { name: "Pénz (Nagy pénz)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Gypsy_card_Money.jpg/320px-Gypsy_card_Money.jpg" },
            { name: "Kevés pénz", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Gypsy_card_Some_money.jpg/320px-Gypsy_card_Some_money.jpg" },
            { name: "Ajándék", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Gypsy_card_Gift.jpg/320px-Gypsy_card_Gift.jpg" },
            { name: "Örvendezés", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Gypsy_card_Merriment.jpg/320px-Gypsy_card_Merriment.jpg" },
            { name: "Váratlan öröm", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Gypsy_card_Unexpected_joy.jpg/320px-Gypsy_card_Unexpected_joy.jpg" },
            { name: "Szerencse", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Gypsy_card_Fortune.jpg/320px-Gypsy_card_Fortune.jpg" },
            { name: "Utazás", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Gypsy_card_Journey.jpg/320px-Gypsy_card_Journey.jpg" },
            { name: "Levél", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Gypsy_card_Letter.jpg/320px-Gypsy_card_Letter.jpg" },
            { name: "Látogatás", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Gypsy_card_Visit.jpg/320px-Gypsy_card_Visit.jpg" },
            { name: "Gyermek", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Gypsy_card_Child.jpg/320px-Gypsy_card_Child.jpg" },
            { name: "Ház", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Gypsy_card_House.jpg/320px-Gypsy_card_House.jpg" },
            { name: "Tisztesség", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Gypsy_card_Honesty.jpg/320px-Gypsy_card_Honesty.jpg" },
            { name: "Katonaság", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Gypsy_card_Officer.jpg/320px-Gypsy_card_Officer.jpg" },
            { name: "Bíró", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Gypsy_card_Judge.jpg/320px-Gypsy_card_Judge.jpg" },
            { name: "Lelkész", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Gypsy_card_Ecclesiastic.jpg/320px-Gypsy_card_Ecclesiastic.jpg" },
            { name: "Gond", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Gypsy_card_Sorrow.jpg/320px-Gypsy_card_Sorrow.jpg" },
            { name: "Bánat", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Gypsy_card_Grief.jpg/320px-Gypsy_card_Grief.jpg" },
            { name: "Bosszúság", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Gypsy_card_Jealousy.jpg/320px-Gypsy_card_Jealousy.jpg" },
            { name: "Hamisság", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Gypsy_card_Falsehood.jpg/320px-Gypsy_card_Falsehood.jpg" },
            { name: "Veszteség", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Gypsy_card_Loss.jpg/320px-Gypsy_card_Loss.jpg" },
            { name: "Betegség", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Gypsy_card_Sickness.jpg/320px-Gypsy_card_Sickness.jpg" },
            { name: "Halál", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Gypsy_card_Death.jpg/320px-Gypsy_card_Death.jpg" },
            { name: "Özvegy ember", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Gypsy_card_Widower.jpg/320px-Gypsy_card_Widower.jpg" },
            { name: "Özvegy nő", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Gypsy_card_Widow.jpg/320px-Gypsy_card_Widow.jpg" },
            { name: "Várakozás", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Gypsy_card_Desire.jpg/320px-Gypsy_card_Desire.jpg" },
            { name: "Örökség", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Gypsy_card_Inheritance.jpg/320px-Gypsy_card_Inheritance.jpg" },
            { name: "Gondolat", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Gypsy_card_Thought.jpg/320px-Gypsy_card_Thought.jpg" },
            { name: "Kellemetlenség", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Gypsy_card_Trouble.jpg/320px-Gypsy_card_Trouble.jpg" },
            { name: "Szerencsétlenség", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Gypsy_card_Misfortune.jpg/320px-Gypsy_card_Misfortune.jpg" },
            { name: "Állandóság", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Gypsy_card_Constancy.jpg/320px-Gypsy_card_Constancy.jpg" }
        ];

        let currentTab = 'quick';

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            const newArray = [...array];
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
            }
            return newArray;
        }

        function createCardElement(card) {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.innerHTML = `
                <div class="card-inner">
                    <img src="${card.img}" alt="${card.name}">
                    <div class="card-name-tag">${card.name}</div>
                </div>
            `;
            return wrapper;
        }

        function renderQuickDraw() {
            const container = document.getElementById('quickDraw');
            container.innerHTML = '';
            const shuffled = shuffle(cardsData).slice(0, 3);
            shuffled.forEach(card => container.appendChild(createCardElement(card)));
        }

        function renderFullTableau() {
            const container = document.getElementById('fullTableau');
            container.innerHTML = '';
            const shuffled = shuffle(cardsData);
            shuffled.forEach(card => container.appendChild(createCardElement(card)));
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.deck-container').forEach(c => c.classList.remove('active'));

            if (tab === 'quick') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('quickDraw').classList.add('active');
                renderQuickDraw();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('fullTableau').classList.add('active');
                renderFullTableau();
            }
        }

        function reshuffleCurrentTab() {
            if (currentTab === 'quick') {
                renderQuickDraw();
            } else {
                renderFullTableau();
            }
        }

        renderQuickDraw();
    </script>
</body>
</html>
