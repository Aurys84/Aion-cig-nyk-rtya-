<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurys Cigánykártya - Mátrix Labor</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-gold: #d4af37;
            --accent-gold-glow: rgba(212, 175, 55, 0.4);
            --text-color: #c5c6c7;
        }

        body {
            background: radial-gradient(circle, #1a1c23 0%, #050508 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px var(--accent-gold-glow);
        }

        .subtitle {
            color: var(--text-color);
            font-size: 0.85rem;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--accent-gold);
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .deck-container {
            display: none !important;
            width: 100%;
            max-width: 1300px;
        }

        /* 3 Lapos Gyorshúzás */
        #quickDraw.active {
            display: flex !important;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        #quickDraw .card-wrapper {
            width: 200px;
            height: 330px;
        }

        /* 36 Lapos Tabló - Sorok szerinti elkülönítés */
        #fullTableau.active {
            display: flex !important;
            flex-direction: column;
            gap: 25px;
            margin-top: 10px;
            width: 100%;
        }

        .tableau-row {
            display: flex;
            flex-direction: column;
            width: 100%;
            background: rgba(31, 40, 51, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 12px;
            box-sizing: border-box;
        }

        .row-header {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 0 8px var(--accent-gold-glow);
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 4px;
            text-align: left;
        }

        .row-cards {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 10px;
            width: 100%;
        }

        #fullTableau .card-wrapper {
            width: 100%;
            height: 200px; /* Megnövelt kártyaméret */
        }

        .card-wrapper {
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            border: 1.5px solid var(--accent-gold);
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-inner:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px var(--accent-gold-glow);
        }

        .card-inner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .action-btn {
            margin-top: 25px;
            background: transparent;
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 20px var(--accent-gold-glow);
        }

        /* Mobil nézetre igazítás */
        @media (max-width: 900px) {
            .row-cards {
                grid-template-columns: repeat(3, 1fr);
            }
            #fullTableau .card-wrapper {
                height: 170px;
            }
        }
    </style>
</head>
<body>

    <h1>Aurys Cigánykártya</h1>
    <div class="subtitle">Mátrix Labor • Eredeti Saját Pakli</div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('quick')">3 Lapos Gyorshúzás</button>
        <button class="tab-btn" onclick="switchTab('full')">36 Lapos Tabló</button>
    </div>

    <div id="quickDraw" class="deck-container active"></div>
    <div id="fullTableau" class="deck-container"></div>

    <button class="action-btn" onclick="reshuffleCurrentTab()">Újrakeverés / Új leosztás 𓋹</button>

    <script>
        const cardsData = [
            "c1.jpg", "c2.jpg", "c3.jpg", "c4.jpg", "c5.jpg", "c6.jpg", "c7.jpg", "c8.jpg", "c9.jpg", "c10.jpg",
            "c11.jpg", "c12.jpg", "c13.jpg", "c14.jpg", "c15.jpg", "c16.jpg", "c17.jpg", "c18.jpg", "c19.jpg", "c20.jpg",
            "c21.jpg", "c22.jpg", "c23.jpg", "c24.jpg", "c26.jpg", "c27.jpg", "c28.jpg", "c29.jpg", "c30.jpg",
            "c31.jpg", "c32.jpg", "c33.jpg", "c34.jpg", "c35.jpg", "c36.jpg", "c37.jpg"
        ];

        let currentTab = 'quick';

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            const newArray = [...array];
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
            }
            return newArray;
        }

        function createCardElement(imgSrc) {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.innerHTML = `
                <div class="card-inner">
                    <img src="./${imgSrc}" alt="Cigánykártya lap">
                </div>
            `;
            return wrapper;
        }

        function renderQuickDraw() {
            const container = document.getElementById('quickDraw');
            container.innerHTML = '';
            const shuffled = shuffle(cardsData).slice(0, 3);

            shuffled.forEach(imgSrc => {
                container.appendChild(createCardElement(imgSrc));
            });
        }

        function renderFullTableau() {
            const container = document.getElementById('fullTableau');
            container.innerHTML = '';
            const shuffled = shuffle(cardsData);
            
            const rowTitles = [
                "1. SOR: MÚLT (Előzmények, gyökerek)",
                "2. SOR: JELEN (A pillanat állapota)",
                "3. SOR: JÖVŐ (Közeljövő, bontakozó energiák)",
                "4. SOR: TANÁCS / KINCS (Kimenetel, belső útmutatás)"
            ];

            // 4 sorba osztjuk (9 lap / sor)
            for (let i = 0; i < 4; i++) {
                const rowBlock = document.createElement('div');
                rowBlock.className = 'tableau-row';

                const title = document.createElement('div');
                title.className = 'row-header';
                title.innerText = rowTitles[i];
                rowBlock.appendChild(title);

                const cardsGrid = document.createElement('div');
                cardsGrid.className = 'row-cards';

                const rowCards = shuffled.slice(i * 9, (i + 1) * 9);
                rowCards.forEach(imgSrc => {
                    cardsGrid.appendChild(createCardElement(imgSrc));
                });

                rowBlock.appendChild(cardsGrid);
                container.appendChild(rowBlock);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const btnQuick = document.querySelectorAll('.tab-btn')[0];
            const btnFull = document.querySelectorAll('.tab-btn')[1];
            const quickContainer = document.getElementById('quickDraw');
            const fullContainer = document.getElementById('fullTableau');

            if (tab === 'quick') {
                btnQuick.classList.add('active');
                btnFull.classList.remove('active');
                
                quickContainer.classList.add('active');
                fullContainer.classList.remove('active');
                
                renderQuickDraw();
            } else {
                btnFull.classList.add('active');
                btnQuick.classList.remove('active');
                
                fullContainer.classList.add('active');
                quickContainer.classList.remove('active');
                
                renderFullTableau();
            }
        }

        function reshuffleCurrentTab() {
            if (currentTab === 'quick') {
                renderQuickDraw();
            } else {
                renderFullTableau();
            }
        }

        renderQuickDraw();
    </script>
</body>
</html>
