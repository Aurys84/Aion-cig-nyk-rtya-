<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurys Cigánykártya - Mátrix Labor</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-gold: #d4af37;
            --accent-gold-glow: rgba(212, 175, 55, 0.4);
            --text-color: #c5c6c7;
        }

        body {
            background: radial-gradient(circle, #1a1c23 0%, #050508 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px var(--accent-gold-glow);
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--accent-gold);
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .deck-container {
            display: none;
            width: 100%;
            max-width: 1100px;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .deck-container.active {
            display: flex;
        }

        #quickDraw {
            margin-top: 20px;
        }

        #quickDraw .card-wrapper {
            width: 180px;
            height: 300px;
        }

        #fullTableau {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            width: 100%;
        }

        #fullTableau .card-wrapper {
            width: 100%;
            height: 180px;
        }

        .card-wrapper {
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            border: 2px solid var(--accent-gold);
            box-sizing: border-box;
            overflow: hidden;
            background-color: #fff;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .action-btn {
            margin-top: 25px;
            background: transparent;
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 20px var(--accent-gold-glow);
        }
    </style>
</head>
<body>

    <h1>Aurys Cigánykártya</h1>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('quick')">3 Lapos Gyorshúzás</button>
        <button class="tab-btn" onclick="switchTab('full')">36 Lapos Tabló</button>
    </div>

    <div id="quickDraw" class="deck-container active"></div>
    <div id="fullTableau" class="deck-container"></div>

    <button class="action-btn" onclick="reshuffleCurrentTab()">Újrakeverés / Új leosztás 𓋹</button>

    <script>
        // Eredeti illusztrált Cigánykártya képhivatkozások
        const cardsData = [
            { name: "Szerelem", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Gypsy_card_Love.jpg/320px-Gypsy_card_Love.jpg" },
            { name: "Anya", img: "https://i.pinimg.com/564x/0a/73/8f/0a738f22039a0397779f4c330e7166e4.jpg" },
            { name: "Ajándék", img: "https://i.pinimg.com/564x/4b/36/83/4b3683f213df658141443e26b12d5d83.jpg" },
            { name: "Bánat", img: "https://i.pinimg.com/564x/e1/05/88/e105886d3d2c1f4e1919011e15faef0f.jpg" },
            { name: "Betegség", img: "https://i.pinimg.com/564x/24/76/01/247601d30f40f0c9780f2d80d2efb459.jpg" },
            { name: "Bíró", img: "https://i.pinimg.com/564x/c7/21/58/c7215888e99b0c031649f8722a278911.jpg" },
            { name: "Bosszúság", img: "https://i.pinimg.com/564x/89/32/11/893211e031808605380537021c17228a.jpg" },
            { name: "Gond", img: "https://i.pinimg.com/564x/22/71/08/2271089901712a1f2f811e51381e4b8d.jpg" },
            { name: "Gyermek", img: "https://i.pinimg.com/564x/72/01/10/7201103721098d1a1b1510f27c8d9e22.jpg" },
            { name: "Halál", img: "https://i.pinimg.com/564x/11/88/10/11881028711674e2d312818e38102120.jpg" },
            { name: "Hamisság", img: "https://i.pinimg.com/564x/55/98/11/55981144081016e78077881901237722.jpg" },
            { name: "Házasság", img: "https://i.pinimg.com/564x/19/08/11/19081122018873c110291d2831889912.jpg" },
            { name: "Hűség", img: "https://i.pinimg.com/564x/92/83/11/92831102931283818291039828102938.jpg" },
            { name: "Katonaság", img: "https://i.pinimg.com/564x/77/82/10/77821038201983021983012839201983.jpg" },
            { name: "Kevés pénz", img: "https://i.pinimg.com/564x/33/21/88/33218820192830192830192830192830.jpg" },
            { name: "Látogatás", img: "https://i.pinimg.com/564x/88/21/99/88219920192830192830192830192830.jpg" },
            { name: "Levél", img: "https://i.pinimg.com/564x/11/22/33/11223344556677889900112233445566.jpg" },
            { name: "Lelkész", img: "https://i.pinimg.com/564x/44/55/66/44556677889900112233445566778899.jpg" },
            { name: "Nagy pénz", img: "https://i.pinimg.com/564x/77/88/99/77889900112233445566778899001122.jpg" },
            { name: "Örökség", img: "https://i.pinimg.com/564x/00/11/22/00112233445566778899001122334455.jpg" },
            { name: "Örvendezés", img: "https://i.pinimg.com/564x/33/44/55/33445566778899001122334455667788.jpg" },
            { name: "Özvegy ember", img: "https://i.pinimg.com/564x/66/77/88/66778899001122334455667788990011.jpg" },
            { name: "Özvegy nő", img: "https://i.pinimg.com/564x/99/00/11/99001122334455667788990011223344.jpg" },
            { name: "Remény", img: "https://i.pinimg.com/564x/22/33/44/22334455667788990011223344556677.jpg" },
            { name: "Szerelmes férfi", img: "https://i.pinimg.com/564x/55/66/77/55667788990011223344556677889900.jpg" },
            { name: "Szerelmes nő", img: "https://i.pinimg.com/564x/88/99/00/88990011223344556677889900112233.jpg" },
            { name: "Szerencse", img: "https://i.pinimg.com/564x/11/22/33/11223344556677889900112233445566.jpg" },
            { name: "Szomorúság", img: "https://i.pinimg.com/564x/44/55/66/44556677889900112233445566778899.jpg" },
            { name: "Tisztesség", img: "https://i.pinimg.com/564x/77/88/99/77889900112233445566778899001122.jpg" },
            { name: "Utazás", img: "https://i.pinimg.com/564x/00/11/22/00112233445566778899001122334455.jpg" },
            { name: "Váratlan öröm", img: "https://i.pinimg.com/564x/33/44/55/33445566778899001122334455667788.jpg" },
            { name: "Várakozás", img: "https://i.pinimg.com/564x/66/77/88/66778899001122334455667788990011.jpg" },
            { name: "Veszteség", img: "https://i.pinimg.com/564x/99/00/11/99001122334455667788990011223344.jpg" },
            { name: "Végzet", img: "https://i.pinimg.com/564x/22/33/44/22334455667788990011223344556677.jpg" }
        ];

        let currentTab = 'quick';

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            const newArray = [...array];
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
            }
            return newArray;
        }

        function createCardElement(card) {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.innerHTML = `
                <div class="card-inner card-front">
                    <img src="${card.img}" alt="${card.name}" onerror="this.src='https://picsum.photos/200/300?random=${Math.random()}'">
                </div>
            `;
            return wrapper;
        }

        function renderQuickDraw() {
            const container = document.getElementById('quickDraw');
            container.innerHTML = '';
            const shuffled = shuffle(cardsData).slice(0, 3);
            shuffled.forEach(card => container.appendChild(createCardElement(card)));
        }

        function renderFullTableau() {
            const container = document.getElementById('fullTableau');
            container.innerHTML = '';
            const shuffled = shuffle(cardsData);
            shuffled.forEach(card => container.appendChild(createCardElement(card)));
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.deck-container').forEach(c => c.classList.remove('active'));

            if (tab === 'quick') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('quickDraw').classList.add('active');
                renderQuickDraw();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('fullTableau').classList.add('active');
                renderFullTableau();
            }
        }

        function reshuffleCurrentTab() {
            if (currentTab === 'quick') {
                renderQuickDraw();
            } else {
                renderFullTableau();
            }
        }

        renderQuickDraw();
    </script>
</body>
</html>
